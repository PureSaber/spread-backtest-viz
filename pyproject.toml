[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spread-backtest-viz"
version = "0.1.0"
description = "Visualization toolkit for futures spread backtest outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
spread-viz = "spread_viz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spread_viz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
