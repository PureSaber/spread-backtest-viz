[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spread-backtest-viz"
version = "0.2.0"
description = "Deprecated compatibility shim for futures spread viz (use quant-report-hub)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "quant-report-hub @ git+https://github.com/PureSaber/quant-report-hub.git@b334b34a61f6e563916add32af94d70dc7ed7494",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0"]

[project.scripts]
spread-viz = "spread_viz.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["spread_viz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
